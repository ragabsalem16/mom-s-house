<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script src="js/api-client.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إعدادات الحساب | بيت ماما</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;font-family:Cairo,sans-serif}body{margin:0;background:#FAF7F8;color:#20181B}.box{max-width:500px;margin:50px auto;background:#fff;padding:25px;border:1px solid #F3E7EB;border-radius:20px;box-shadow:0 8px 24px rgba(138,0,52,.06)}input{width:100%;padding:11px;border:1px solid #F3E7EB;border-radius:12px;margin:6px 0 14px}button{width:100%;background:linear-gradient(135deg,#8A0034,#E63956);color:#fff;border:0;border-radius:999px;padding:12px;font:inherit;cursor:pointer}a{color:#8A0034}</style>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/customer-shell.css">
<link rel="stylesheet" href="css/app-polish.css">
</head><body><beit-mama-header></beit-mama-header><main class="box"><h1>تغيير كلمة المرور</h1><p>لأمان الحساب، يجب إدخال كلمة المرور الحالية. الاستعادة عبر البريد أو الرسائل تتطلب إعداد مزود خارجي.</p>
<form onsubmit="changePassword(event)"><label>كلمة المرور الحالية<input id="current" type="password" required autocomplete="current-password"></label><label>كلمة المرور الجديدة (8 أحرف على الأقل)<input id="next" type="password" minlength="8" required autocomplete="new-password"></label><label>تأكيد كلمة المرور الجديدة<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button>حفظ كلمة المرور</button></form><p id="message"></p><a href="index.html">العودة للمتجر</a></main>
<script>
async function changePassword(e){e.preventDefault();const message=document.getElementById('message');const currentPassword=document.getElementById('current').value;const newPassword=document.getElementById('next').value;const confirmation=document.getElementById('confirm').value;if(newPassword!==confirmation){message.textContent='كلمتا المرور غير متطابقتين';return}const r=await fetch('/api/account/password',{method:'POST',body:new URLSearchParams({current_password:currentPassword,new_password:newPassword})});const d=await r.json();message.textContent=d.success?'تم تغيير كلمة المرور بنجاح':d.message;if(d.success)e.target.reset()}
(async()=>{const r=await fetch('/api/me');if(!r.ok)location.href='login.html'})();
</script><custom-dock-bottom-bar selected-index="3"></custom-dock-bottom-bar><script src="js/custom-dock-bottom-bar.js"></script></body></html>
