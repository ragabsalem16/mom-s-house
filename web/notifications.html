<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="js/api-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الإشعارات والمتابعات | بيت ماما</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/customer-shell.css">
    <link rel="stylesheet" href="css/app-polish.css">
    <style>
        :root { --burgundy: #8A0034; --rose: #E63956; --cream: #FAF7F8; --line: #F3E7EB; --muted: #756A6E; }
        body { margin: 0; background: var(--cream); color: #20181B; font-family: Cairo, sans-serif; }
        main { max-width: 600px; margin: 30px auto; padding: 0 20px 80px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { color: var(--burgundy); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .page-header p { color: var(--muted); font-size: 15px; }
        .feed-list { display: flex; flex-direction: column; gap: 16px; }
        .mother-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(138,0,52,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .mother-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(138,0,52,0.1); }
        .mother-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--line);
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px var(--burgundy);
        }
        .mother-info { flex: 1; }
        .mother-name { display: block; font-weight: 800; font-size: 17px; color: var(--burgundy); margin-bottom: 4px; }
        .mother-region { display: block; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
        .unfollow-btn {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .unfollow-btn:hover { background: #fff0f3; color: var(--rose); border-color: var(--rose); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state .icon { font-size: 50px; margin-bottom: 16px; display: block; }
        .empty-state b { color: var(--burgundy); display: block; margin-bottom: 8px; font-size: 18px; }
    </style>
</head>
<body>
    <beit-mama-header></beit-mama-header>
    <main>
        <div class="page-header">
            <h1>إشعارات المتابعة 🔔</h1>
            <p>هنا تجدين تحديثات الأمهات اللاتي تتابعينهن</p>
        </div>
        <div id="feed" class="feed-list">
            <div class="empty-state">جاري تحميل المتابعات...</div>
        </div>
    </main>
    <custom-dock-bottom-bar selected-index="1"></custom-dock-bottom-bar>
    <script src="js/custom-dock-bottom-bar.js"></script>
    <script>
        async function loadFollows() {
            const feed = document.getElementById('feed');
            try {
                const res = await fetch('/api/follows');
                if (!res.ok) throw new Error('تعذر تحميل قائمة المتابعات');
                const mothers = await res.json();
                feed.innerHTML = '';
                if (!mothers.length) {
                    feed.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">👩‍🍳</span>
                            <b>لا تتابعين أي أم حالياً</b>
                            <p>تابعي أمهاتك المفضلات لتصلي أول من يعلم بوجباتهن الجديدة!</p>
                            <a href="index.html" style="color:var(--burgundy); font-weight:800; text-decoration:none; display:inline-block; margin-top:15px; padding:10px 20px; background:#fff0f3; border-radius:999px;">استكشفي الأمهات ←</a>
                        </div>`;
                    return;
                }
                mothers.forEach(mother => {
                    const card = document.createElement('div');
                    card.className = 'mother-card';

                    const link = document.createElement('a');
                    link.href = `mother.html?id=${mother.id}`;
                    link.style.display = 'flex';
                    link.style.alignItems = 'center';
                    link.style.gap = '16px';
                    link.style.flex = '1';
                    link.style.textDecoration = 'none';
                    link.style.color = 'inherit';

                    const img = document.createElement('img');
                    img.className = 'mother-avatar';
                    img.src = window.beitMamaResourceUrl(mother.profileImageUrl || 'images/default-avatar.jpg');
                    img.alt = mother.name;

                    const info = document.createElement('div');
                    info.className = 'mother-info';
                    const name = document.createElement('span');
                    name.className = 'mother-name';
                    name.textContent = mother.name;
                    const region = document.createElement('span');
                    region.className = 'mother-region';
                    region.innerHTML = `📍 ${mother.region || 'منطقة غير محددة'}`;
                    info.append(name, region);

                    link.append(img, info);

                    const unfollowBtn = document.createElement('button');
                    unfollowBtn.className = 'unfollow-btn';
                    unfollowBtn.textContent = 'إلغاء';
                    unfollowBtn.onclick = async (e) => {
                        e.preventDefault();
                        if (!confirm('هل تريدين إلغاء متابعة ' + mother.name + '؟')) return;
                        const r = await fetch('/api/follows', {
                            method: 'POST',
                            body: new URLSearchParams({ seller_id: mother.id })
                        });
                        if (r.ok) loadFollows();
                    };

                    card.append(link, unfollowBtn);
                    feed.append(card);
                });
            } catch (e) {
                feed.innerHTML = `<div class="empty-state">❌ ${e.message}</div>`;
            }
        }
        window.onload = loadFollows;
    </script>
</body>
</html>
