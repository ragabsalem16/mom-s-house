<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الدخول أو إنشاء حساب | بيت ماما</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-pink: #c2185b;
            --brand-pink-dark: #9c1048;
            --brand-pink-light: #fce4ec;
            --brand-green: #2e7d32;
            --text-main: #212121;
            --text-sub: #666666;
            --bg-page: #fbf9f8;
            --card-border: #f0e6e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; line-height: 1.5; }

        header {
            background: #ffffff;
            border-bottom: 1px solid #f2eaea;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-badge svg { width: 34px; height: 34px; }
        .logo-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--brand-pink);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: #444;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--brand-pink); }

        /* Login Box Card */
        .box {
            max-width: 440px;
            margin: 50px auto 60px;
            background: #ffffff;
            padding: 38px 32px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 35px rgba(194, 24, 91, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--brand-pink);
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            background: #fdf2f5;
            padding: 5px;
            border-radius: 999px;
        }
        .tabs button {
            flex: 1;
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 9px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tabs button.active {
            background: var(--brand-pink);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(194, 24, 91, 0.25);
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 6px;
            color: #333;
            font-size: 13.5px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dedede;
            border-radius: 12px;
            font-size: 14px;
            background: #fafafa;
            color: #222;
            transition: 0.2s;
        }
        input:focus {
            border-color: var(--brand-pink);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(194, 24, 91, 0.12);
        }

        button.btn-primary {
            width: 100%;
            margin-top: 20px;
            background: var(--brand-pink);
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(194, 24, 91, 0.25);
            transition: all 0.2s;
        }
        button.btn-primary:hover {
            background: var(--brand-pink-dark);
            transform: translateY(-2px);
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 16px;
            color: #999;
            font-size: 13px;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px;
            border: 1.5px solid #dedede;
            border-radius: 999px;
            background: #fff;
            color: #444;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all .2s;
        }
        .google-btn:hover {
            background: #fafafa;
            border-color: #bbb;
        }

        .message {
            min-height: 24px;
            color: var(--brand-pink);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-sub);
        }
        .footer a {
            color: var(--brand-pink);
            text-decoration: none;
            font-weight: 700;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-area">
                <span class="logo-badge">
                    <svg viewBox="0 0 40 40" fill="none">
                        <path d="M20 4L4 16V34C4 35.1 4.9 36 6 36H34C35.1 36 36 35.1 36 34V16L20 4Z" stroke="#c2185b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20 23C20 23 15 19 15 16C15 14 17 12 20 15C23 12 25 14 25 16C25 19 20 23 20 23Z" fill="#c2185b"/>
                    </svg>
                </span>
                <span class="logo-title">بيت ماما</span>
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="index.html#foods">الطلبات</a></li>
                    <li><a href="join.html">تسجيل الأمهات</a></li>
                    <li><a href="login.html" class="active">تسجيل الدخول</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="box">
        <h1>أهلاً بك في بيت ماما</h1>
        <div class="tabs">
            <button id="loginTab" class="active" type="button" onclick="switchTab('login')">تسجيل الدخول</button>
            <button id="registerTab" type="button" onclick="switchTab('register')">عميل جديد</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input id="loginEmail" type="email" required autocomplete="username" placeholder="name@example.com">

            <label for="loginPass">كلمة المرور</label>
            <input id="loginPass" type="password" required autocomplete="current-password" placeholder="••••••••">

            <button class="btn-primary" type="submit">دخول</button>
        </form>

        <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
            <label for="regName">الاسم بالكامل</label>
            <input id="regName" type="text" required placeholder="اسمك الكريم">

            <label for="regEmail">البريد الإلكتروني</label>
            <input id="regEmail" type="email" required placeholder="name@example.com">

            <label for="regPhone">رقم الهاتف للتواصل</label>
            <input id="regPhone" type="tel" required placeholder="010XXXXXXXX">

            <label for="regPass">كلمة المرور</label>
            <input id="regPass" type="password" required placeholder="••••••••">

            <button class="btn-primary" type="submit">إنشاء الحساب</button>
        </form>

        <div class="or-divider">أو</div>

        <a class="google-btn" href="/api/auth/google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            المتابعة باستخدام Google
        </a>

        <div class="message" id="msg"></div>

        <div class="footer">
            طاهية ماهرة وتريدين الانضمام؟ <a href="join.html">سجلي كأم طاهية</a>
        </div>
    </main>

    <script>
        function switchTab(t) {
            const isLogin = t === 'login';
            document.getElementById('loginTab').className = isLogin ? 'active' : '';
            document.getElementById('registerTab').className = isLogin ? '' : 'active';
            document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
            document.getElementById('msg').textContent = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = 'جاري تسجيل الدخول...';

            const payload = new URLSearchParams({
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPass').value
            });

            try {
                const res = await fetch('/api/login', { method: 'POST', body: payload });
                const data = await res.json();
                if (data.success) {
                    if (data.user.role === 'ADMIN') location.href = 'admin-dashboard.html';
                    else if (data.user.role === 'MOTHER') location.href = 'mother-dashboard.html';
                    else location.href = 'index.html';
                } else {
                    msg.textContent = data.message || 'خطأ في بيانات الدخول';
                }
            } catch (err) {
                msg.textContent = 'تعذر الاتصال بالخادم';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = 'جاري إنشاء الحساب...';

            const payload = new URLSearchParams({
                name: document.getElementById('regName').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                password: document.getElementById('regPass').value
            });

            try {
                const res = await fetch('/api/register', { method: 'POST', body: payload });
                const data = await res.json();
                if (data.success) {
                    alert('تم إنشاء حسابك بنجاح! جاري تحويلك...');
                    location.href = 'index.html';
                } else {
                    msg.textContent = data.message || 'خطأ في إنشاء الحساب';
                }
            } catch (err) {
                msg.textContent = 'تعذر الاتصال بالخادم';
            }
        }
    </script>
</body>
</html>
